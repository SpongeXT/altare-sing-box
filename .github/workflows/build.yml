name: Build altare-sing-box

on:
  push:
    branches: [main]
  workflow_dispatch:

# 与 SpongeXT/kasm-minimal-nossl 的 build.yml 同一套做法:
# 标准 GITHUB_TOKEN 登录 GHCR, 不需要也不使用任何自建 secret。
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # latest 供 Altare 直接填; sha 标签供部署时按 digest 钉住回滚。
          tags: |
            ghcr.io/spongext/altare-sing-box:latest
            ghcr.io/spongext/altare-sing-box:${{ github.sha }}
